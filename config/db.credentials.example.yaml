# Template for a PostgreSQL credentials record (see config/config.yaml).
# Copy to a plaintext file, fill it in, then encrypt it:
#   sops --encrypt --age <pubkey> plain.yaml > secrets/db.sops.yaml
# Never commit the plaintext copy.
host: db.example.org
port: 5432
dbname: analytics
user: sqlsink
password: change-me
sslmode: require
# sslrootcert: /path/to/ca.pem
# sslcert: /path/to/client.pem
# sslkey: /path/to/client.key
# options: "-c statement_timeout=0"
# hostaddr: 127.0.0.1   # connect here, but verify TLS against `host` (ssh tunnel)
# ca: |                 # inline PEM CA, written to a private 0600 file; sets
#   -----BEGIN CERTIFICATE-----   sslrootcert, and sslmode defaults to verify-full
#   ...
# Aliases: database=dbname, username=user, ca_path=sslrootcert.
#
# The record may also live inside a shared document with other secrets; point
# `credentials` at `PATH#section.role`, e.g.
#   credentials: secrets/all.sops.yaml#analytics.loader
# where `analytics:` holds host/port/database/ca and `loader:` holds
# username/password (plain fields of each level along the path are merged,
# inner wins; sibling mappings such as `runtime:` are ignored).
