  - table_01
  # ... full list of 37 table names goes here

# PostgreSQL DSN (production sink). The local sink is a DuckDB file:
# select it with `sinks: [duckdb]` and `duckdb_sink_path: results/sink.duckdb`.
# `sinks:` defaults to [postgres]; list both to publish to both.
db:
  dsn: "postgresql+psycopg://user:pass@localhost:5432/analytics"

loader_version: 1

# Logical datasets published as a compact fact table + shared contour
# table + public compatibility view instead of a plain 1:1 Parquet->table
# copy (see docs/postgresql-geometry-normalization.md in cgdd-sevs-ecf).
# Each entry is a sqlsink.manifest.DatasetMaterialization, loaded via
# manifest.load_manifest().
#
# Join columns and output_columns were read off the real Parquets (never
# guessed from names) and each entry's equivalence -- published view ==
# original expanded Parquet, as a multiset -- was verified on 2026-09-24
# with workflow/scripts/verify_equivalence.py. output_columns must match the
# Parquet's column names exactly: "Famille professionnelle (FAP\u00a02021/341)"
# contains a non-breaking space. If a producer changes its columns, refresh
# the list and re-run the equivalence check.
#
# Manifest v2 (a dataset that declares `components`) is accepted alongside. The
# four datasets below stay v1 on purpose: their published markers and hashes are
# unchanged. Shape of a v2 dataset (see tests/test_v2_sink.py for worked cases):
#
#   components:                       # top level: shared, staged once, referenced by name
#     - {name: sector_paths, kind: dimension, primary_key: [region, f21, path]}
#   datasets:
#     - name: transitions
#       materialize: view             # or: materialized
#       components:
#         - sector_paths              # shared
#         - {name: fact, kind: fact, primary_key: [obs_id]}
#         - {name: bridge, kind: bridge, primary_key: [anchor, f21], priority: priority}
#       # either `view.joins` (many-to-one lookups; a fan-out needs `fan_out: true`) ...
#       # ... or `view_sql`, with {component} references, a string or {duckdb:, postgresql:}:
#       view_sql: "SELECT ... FROM {fact} f JOIN {bridge} b ON ... JOIN {sector_paths} p ON ..."
datasets:
  - name: ecarts_emploi_formation_ze
    fact_source: ecarts_emploi_formation_ze
    contour_source: zone_emploi_contours
    contour_table: zone_emploi_contours
    geometry_column: polygon_coords
    fact_join_columns: ["Code ZE"]
    contour_join_columns: ["Code ZE"]
    compact_schema: analytics_storage
    output_columns:
