[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlsink"
version = "0.1.1"
description = "Per-table incremental Parquet-to-SQL publishing core (private, repo-local, not published)."
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0", "pyyaml"]

[project.optional-dependencies]
duckdb = ["duckdb", "duckdb_engine", "pyarrow", "pytz"]
postgres = ["psycopg[binary]"]

[tool.setuptools]
packages = ["sqlsink"]
